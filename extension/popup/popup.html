<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Drift</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <img src="../icons/icon32.png" width="24" height="24" alt="">
    <strong>Video Drift</strong>
    <span class="ver" id="ver"></span>
  </header>

  <nav class="tabs" role="tablist" data-i18n-label="navigation">
    <button id="tab-current" role="tab" aria-selected="true" aria-controls="view-current" data-view="current" data-i18n="tabCurrent"></button>
    <button id="tab-history" role="tab" aria-selected="false" aria-controls="view-history" tabindex="-1" data-view="history" data-i18n="tabHistory"></button>
    <button id="tab-library" role="tab" aria-selected="false" aria-controls="view-library" tabindex="-1" data-view="library" data-i18n="bookmarks"></button>
  </nav>

  <section id="view-current" role="tabpanel" aria-labelledby="tab-current">
  <section id="empty" class="empty" hidden>
    <p data-i18n="popupNoVideo"></p>
  </section>

  <main id="main" hidden>
    <div class="now">
      <div class="title" id="title"></div>
      <div class="time" id="time"></div>
      <div class="mode" id="playerMode"></div>
    </div>

    <button class="primary" id="pip" data-i18n="btnFloat"></button>
    <p class="hint" id="pipHint" data-i18n="pipHint" hidden></p>

    <div class="row">
      <button id="copy" data-i18n="btnCopyLink"></button>
      <button id="markBtn" data-i18n="btnBookmark"></button>
    </div>
    <textarea id="note" rows="2" data-i18n-ph="notePlaceholder"></textarea>

    <div class="group">
      <div class="label"><span data-i18n="speed"></span><output id="speedOut"></output></div>
      <div class="chips" id="speeds"></div>
    </div>

    <div class="group">
      <div class="label"><span data-i18n="volume"></span><output id="volOut"></output></div>
      <div class="chips" id="volumes"></div>
    </div>

    <div class="group">
      <div class="label"><span data-i18n="opacity"></span><output id="opOut"></output></div>
      <input type="range" id="opacity" min="30" max="100" step="5">
      <p class="muted" data-i18n="opacityHint"></p>
    </div>

    <div class="group">
      <div class="label"><span data-i18n="bookmarks"></span><span class="count" id="bmCount"></span></div>
      <ul class="bms" id="bms"></ul>
      <p class="muted" id="bmEmpty" data-i18n="bookmarksEmpty"></p>
    </div>
  </main>
    <button id="exportThis" data-i18n="exportThis"></button>
  </section>

  <section id="view-history" role="tabpanel" aria-labelledby="tab-history" hidden>
    <div class="section-head"><h1 data-i18n="tabHistory"></h1><button id="clearHistory" class="subtle" data-i18n="clearHistory"></button></div>
    <p class="muted" data-i18n="historyHint"></p>
    <div id="historyList" class="cards"></div>
    <p id="historyEmpty" class="empty" data-i18n="historyEmpty" hidden></p>
  </section>

  <section id="view-library" role="tabpanel" aria-labelledby="tab-library" hidden>
    <label class="sr-only" for="search" data-i18n="searchBookmarks"></label>
    <input id="search" type="search" data-i18n-ph="searchBookmarks" autocomplete="off">
    <div id="libraryList" class="cards"></div>
    <p id="libraryEmpty" class="empty" hidden></p>
    <button id="exportAll" data-i18n="exportAll"></button>
  </section>
  <p id="notice" class="hint" role="status" hidden></p>

  <details class="settings">
    <summary data-i18n="settings"></summary>
    <label><input type="checkbox" id="autoResume"> <span data-i18n="setAutoResume"></span></label>
    <label><input type="checkbox" id="rememberHistory"> <span data-i18n="setRememberHistory"></span></label>
    <label><input type="checkbox" id="hoverButton"> <span data-i18n="setHoverButton"></span></label>
    <label><input type="checkbox" id="pageMode"> <span data-i18n="setPageMode"></span></label>
    <p class="muted" data-i18n="setButtons"></p>
    <div id="btnToggles" class="toggles"></div>
  </details>

  <footer class="foot">
    <a href="https://vkardin.github.io/video-drift/" target="_blank" rel="noopener" data-i18n="website"></a>
    <span>·</span>
    <a href="https://vkardin.github.io/video-drift/support.html" target="_blank" rel="noopener" data-i18n="support"></a>
  </footer>

  <script src="../shared/store.js"></script>
  <script src="popup.js"></script>
</body>
</html>

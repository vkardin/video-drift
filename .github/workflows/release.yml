name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("extension/manifest.json"))["version"])')
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
  test:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    uses: ./.github/workflows/test.yml
  build:
    needs: [plan, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build archives
        run: python3 tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: video-drift-packages
          path: dist/*.zip
      - name: Read version
        id: ver
        run: echo "version=$(python3 -c "import json;print(json.load(open('extension/manifest.json'))['version'])")" >> "$GITHUB_OUTPUT"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Video Drift ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*.zip
